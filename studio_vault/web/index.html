<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAKKIS STUDIO VAULT</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <nav class="rail" aria-label="Main">
    <div class="brand"><span class="logo logo-wordmark" role="img" aria-label="BAKKIS"></span><span class="brand-sub">STUDIO VAULT</span></div>
    <button class="nav active" data-view="studio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>My Studio</button>
    <button class="nav" data-view="snapshots">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Snapshots</button>
    <button class="nav" data-view="newmac">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>New Mac</button>
    <button class="nav" data-view="inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Inventory</button>
    <div class="rail-foot">
      <span id="version"></span>
      <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </nav>

  <main id="main">
    <section class="view active" id="view-studio" aria-labelledby="studio-title"></section>
    <section class="view" id="view-snapshots"></section>
    <section class="view" id="view-newmac"></section>
    <section class="view" id="view-inventory"></section>
  </main>

  <div class="scrim hidden" id="scrim"></div>
  <aside class="drawer hidden" id="drawer" aria-label="Settings"></aside>
  <div class="modal-wrap hidden" id="modal" role="dialog" aria-modal="true"></div>
  <div class="welcome hidden" id="welcome"></div>
  <div class="modal-wrap hello-wrap hidden" id="hello" role="dialog" aria-modal="true" aria-labelledby="hello-title"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
